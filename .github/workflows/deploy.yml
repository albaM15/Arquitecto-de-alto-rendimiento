name: Deploy to AWS Production

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'deploy/*'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          # Force empty VITE_API_URL so that the site uses relative paths routed through CloudFront
          VITE_API_URL="" npm run build

      - name: Sync static files to S3
        run: |
          aws s3 sync frontend/dist/ s3://ml-grupos-frontend-d6fb2ba8 --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E2QL8MI06DSZX9 --paths "/*"

  deploy-backend:
    name: Deploy Fastapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -t 181777503681.dkr.ecr.us-east-1.amazonaws.com/ml-grupos-backend:latest ./backend
          docker push 181777503681.dkr.ecr.us-east-1.amazonaws.com/ml-grupos-backend:latest

      - name: Force ECS rolling deployment
        run: |
          aws ecs update-service --cluster ml-grupos-cluster --service ml-grupos-backend --force-new-deployment
